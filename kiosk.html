<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에듀케레 바른학습관 출석</title>
<style>:root{--navy:#15352f;--green:#1f6b5b;--mint:#e8f3ef;--line:#dce5e1;--muted:#687773;--red:#b24733}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#f3f6f4;color:#17211f}.wrap{max-width:920px;margin:auto;padding:28px}.hero{background:var(--navy);color:white;border-radius:22px;padding:25px;display:flex;justify-content:space-between;align-items:center}.hero h1{margin:0 0 5px;font-size:25px}.clock{font-size:28px;font-weight:800}.card{background:white;border:1px solid #e5ebe8;border-radius:17px;padding:20px;margin-top:16px;box-shadow:0 12px 35px #19352f12}.students{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.student{border:1px solid var(--line);background:white;border-radius:14px;padding:18px 8px;font-size:17px;font-weight:700;color:var(--navy);cursor:pointer}.student:hover{background:var(--mint);border-color:#9ac8ba}.login{width:min(420px,100%);margin:10vh auto}.field{display:grid;gap:7px;margin:12px 0}.field input{padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:white}.btn.out{background:#49615b}.btn.ghost{background:white;color:var(--navy);border:1px solid var(--line)}dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 24px));box-shadow:0 30px 90px #0004}dialog::backdrop{background:#102922aa}.modal{padding:25px;text-align:center}.pin{font-size:26px;text-align:center;letter-spacing:12px;width:190px;padding:12px;border:1px solid var(--line);border-radius:10px}.actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.message{padding:16px;border-radius:12px;background:var(--mint);color:var(--green);font-weight:700;text-align:center;margin-top:15px}.error{background:#fce9e5;color:var(--red)}@media(max-width:700px){.wrap{padding:14px}.students{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start}.clock{font-size:21px}}</style></head>
<body><div id="login" class="login card"><div style="font-size:22px;font-weight:900;color:var(--navy)">EDUCERE</div><h1>태블릿 출석 로그인</h1><p style="color:var(--muted)">태블릿 전용 계정으로 한 번 로그인하면 상태가 유지됩니다.</p><div class="field"><label>태블릿 계정 이메일</label><input id="email" type="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password"></div><button class="btn" style="width:100%" onclick="login()">출석화면 시작</button><p id="loginMsg" style="color:var(--red)"></p></div>
<div id="screen" class="wrap" style="display:none"><div class="hero"><div><h1>에듀케레 바른학습관</h1><span>본인 이름을 선택해 입실·퇴실을 기록하세요.</span></div><div class="clock" id="clock"></div></div><div id="message"></div><div class="card"><h2>학생 선택</h2><div id="students" class="students"></div></div><div style="text-align:right;margin-top:15px"><button class="btn ghost" onclick="logout()">태블릿 로그아웃</button></div></div>
<dialog id="modal"><div class="modal"><h2 id="studentName"></h2><p>개인 PIN 4자리를 입력하세요.</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4"><div class="actions"><button class="btn" onclick="record('in')">입실</button><button class="btn out" onclick="record('out')">퇴실</button><button class="btn ghost" onclick="modal.close()">취소</button></div><p id="modalMsg" style="color:var(--red)"></p></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const cloud=window.supabase.createClient('https://ltaueydfkkjhjwlmuulk.supabase.co','sb_publishable_Yo1jGN6ECW6ebSm791xU-Q_vzTr9QqP',{auth:{persistSession:true,autoRefreshToken:true}});let selected=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){let{error}=await cloud.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)init()}
async function init(){let{data:{user}}=await cloud.auth.getUser();if(!user)return;let{data:p}=await cloud.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='kiosk'){await cloud.auth.signOut();$('loginMsg').textContent='태블릿 권한이 없는 계정입니다.';return}$('login').style.display='none';$('screen').style.display='block';loadStudents()}
async function loadStudents(){let{data,error}=await cloud.rpc('list_kiosk_students');$('students').innerHTML=error?`<p>${esc(error.message)}</p>`:data.length?data.map(s=>`<button class="student" onclick="choose('${s.student_id}','${esc(s.display_name)}')">${esc(s.display_name)}</button>`).join(''):'<p>원장 화면에서 학생 PIN을 먼저 설정해 주세요.</p>'}
function choose(id,name){selected=id;$('studentName').textContent=name;$('pin').value='';$('modalMsg').textContent='';$('modal').showModal();setTimeout(()=>$('pin').focus(),100)}
async function record(type){if(!/^\d{4}$/.test($('pin').value))return $('modalMsg').textContent='PIN 숫자 4자리를 입력해 주세요.';$('modalMsg').textContent='처리 중...';let{data,error}=await cloud.rpc('record_kiosk_attendance',{p_student_id:selected,p_pin:$('pin').value,p_event_type:type});if(error)return $('modalMsg').textContent=error.message;$('modal').close();$('message').innerHTML=`<div class="message">${esc(data.student)} 학생 ${type==='in'?'입실':'퇴실'} ${esc(data.time)} 기록 완료</div>`;setTimeout(()=>$('message').innerHTML='',4000)}
async function logout(){if(confirm('태블릿에서 로그아웃할까요?')){await cloud.auth.signOut();location.reload()}}
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),1000);init();
</script></body></html>
